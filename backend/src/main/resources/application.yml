spring:
  application:
    name: filebridge-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/filebridge}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:105MB}

server:
  port: ${SERVER_PORT:8080}

filebridge:
  jwt:
    secret: ${JWT_SECRET:FilebridgeSuperSecretJwtSigningKeyMustBeAtLeast256BitsLongForHmacSha256Security}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  storage:
    type: ${STORAGE_TYPE:SUPABASE} # SUPABASE or LOCAL
    local:
      base-path: ${STORAGE_PATH:${user.home}/filebridge-storage}
  supabase:
    url: ${SUPABASE_URL:https://yforzdoqhocjorkshzfx.supabase.co}
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_BUCKET:filebridge-files}
  subscription:
    free-storage-bytes: ${FREE_STORAGE_BYTES:104857600}      # 100 MB default
    premium-storage-bytes: ${PREMIUM_STORAGE_BYTES:524288000} # 500 MB default
    premium-price-inr: ${PREMIUM_PRICE_INR:199}              # ₹199
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
    key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  max-storage-bytes: ${MAX_STORAGE_BYTES:10737418240}        # Fallback

logging:
  level:
    com.filebridge: DEBUG
